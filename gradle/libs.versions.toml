[versions]
kotlin = "2.4.21"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
clikt = "5.1.0"
slf4j = "2.0.20"
junit = "6.1.3"
kotlinx-serialization = "1.11.0"
maven-artifact = "3.10.0"
# tree-sitter-ng: the parser and prebuilt grammars for the guardrails. The grammars bring in older parser versions; the
# parser declared here wins.
tree-sitter = "0.26.6"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin = "0.3.8.1"
# The recipe index is generated from this BOM at build time. The plugin must be built on the BOM's OpenRewrite version
# (`:recipes:checkRewritePluginVersion`).
rewrite-recipe-bom = "3.37.0"
rewrite-maven-plugin = "6.46.1"
maven-help-plugin = "3.5.2"
testcontainers = "2.0.5"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Maven's own version ordering (`ComparableVersion`), for the Maven version scheme.
maven-artifact = { module = "org.apache.maven:maven-artifact", version.ref = "maven-artifact" }
# The guardrails' facts about Java and Kotlin sources. JNI, with native libraries inside the JARs for glibc Linux,
# macOS, and Windows: the container image can't be musl (Alpine).
tree-sitter = { module = "io.github.bonede:tree-sitter", version.ref = "tree-sitter" }
tree-sitter-java = { module = "io.github.bonede:tree-sitter-java", version.ref = "tree-sitter-java" }
tree-sitter-kotlin = { module = "io.github.bonede:tree-sitter-kotlin", version.ref = "tree-sitter-kotlin" }
# OpenRewrite: only on the build-time classpath of the index generator, never at run time.
rewrite-recipe-bom = { module = "org.openrewrite.recipe:rewrite-recipe-bom", version.ref = "rewrite-recipe-bom" }
rewrite-core = { module = "org.openrewrite:rewrite-core" }

# Maven plugins the JVM adapter calls by coordinates in the user's build. Declared here so Dependabot updates them.
rewrite-maven-plugin = { module = "org.openrewrite.maven:rewrite-maven-plugin", version.ref = "rewrite-maven-plugin" }
maven-help-plugin = { module = "org.apache.maven.plugins:maven-help-plugin", version.ref = "maven-help-plugin" }
# The BOM pins every JUnit artifact, including the ones kotlin-test-junit5 brings in.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Starts Ollama in Docker for the real-model test. Test-only.
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-ollama = { module = "org.testcontainers:testcontainers-ollama" }

# Gradle plugins, used by the convention plugin in buildSrc.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
