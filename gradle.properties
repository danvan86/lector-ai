# The single source of the tool's version. The CLI reads it from a generated resource.
version=0.1.0

# The default 512 MB heap runs out when detekt (with type resolution) and Kotlin compilation share the daemon.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
