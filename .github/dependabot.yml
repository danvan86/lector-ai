version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The base images of the tool and the model images. The Ollama version is also the real-model test's.
  - package-ecosystem: docker
    directories:
      - /docker/lector
      - /docker/ollama
    schedule:
      interval: weekly
    # The tool image has one stage per JDK release (17, 21, 25): a major update would turn the JDK 17 stage into 25.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
