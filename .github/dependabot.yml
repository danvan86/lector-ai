version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The reusable workflow runs lector-ai's own action at the tool's version: a release moves the pin, checked by
    # ./gradlew checkReusableWorkflow, not Dependabot.
    ignore:
      - dependency-name: danvan86/lector-ai*
  # The Node tools of the tool image: Corepack, jest-junit, and the package manager versions it pre-caches.
  - package-ecosystem: npm
    directory: /docker/lector/node
    schedule:
      interval: weekly
  # The base images of the tool and the model images. The Ollama version is also the real-model test's.
  - package-ecosystem: docker
    directories:
      - /docker/lector
      - /docker/ollama
    schedule:
      interval: weekly
    # The tool image has one stage per JDK release (17, 21, 25) and per Node LTS line (22, 24): a major update would turn
    # the JDK 17 stage into 25, or Node 22 into 24.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
